<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - HabitAdmin">Dashboard - HabitAdmin</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
         :root {
            --color-green-admin: #10B981;
            --color-green-dark: #047857;
            --color-dark: #1F2937;
        }
        
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        }
        
        .sidebar-bg {
            background-color: #1F2937;
            color: #f3f4f6;
        }
        
        .transition-all {
            transition: all 0.3s ease;
        }
        
        .submenu-item {
            padding-left: 2.5rem;
        }
        
        .bg-green-admin {
            background-color: rgb(16, 185, 129);
        }
        
        .text-green-admin {
            color: rgb(16, 185, 129);
        }
    </style>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">
    <!-- 📍 SIDEBAR - Menu latéral gauche (TOUJOURS VISIBLE) -->
    <aside class="sidebar-bg text-gray-100 w-64 flex flex-col overflow-y-auto shadow-lg fixed left-0 top-0 bottom-0 z-40">
        <!-- Logo et titre -->
        <div class="p-6 border-b border-gray-600">
            <div class="flex items-center space-x-3 mb-2">
                <div class="bg-green-admin text-white w-10 h-10 rounded-lg flex items-center justify-center font-bold text-lg">
                    HA
                </div>
                <div>
                    <h1 class="font-bold text-white">HabitAdmin</h1>
                    <p class="text-xs text-gray-400">Central Admin v0.1</p>
                </div>
            </div>
        </div>

        <!-- Navigation principale -->
        <nav class="flex-1 p-4 space-y-2">
            <!-- Bouton Dashboard principal -->
            <a href="/app/dashboard" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-white transition-all font-medium text-sm bg-green-admin hover:opacity-90">
                <span class="text-lg">📊</span>
                <span>Dashboard Global</span>
            </a>

            <!-- Section Applications -->
            <div class="mt-6">
                <p class="px-4 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">📦 Applications</p>

                <!-- 🏠 Habitago (déroulant) -->
                <div class="space-y-1">
                    <button id="habitago-toggle" class="w-full flex items-center justify-between px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 transition-all font-medium text-sm" data-toggle="habitago">
                        <div class="flex items-center space-x-3">
                            <span class="text-lg">🏠</span>
                            <span>Habitago</span>
                        </div>
                        <svg id="habitago-icon" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                        </svg>
                    </button>
                    <div id="habitago-menu" class="space-y-1">
                        <a href="/app/habitago/dashboard" class="flex items-center space-x-3 px-4 py-2 rounded submenu-item text-gray-400 hover:text-gray-200 hover:bg-gray-700 transition-all text-sm">
                            <span>📊</span><span>Dashboard</span>
                        </a>
                        <a href="/app/habitago/users" class="flex items-center space-x-3 px-4 py-2 rounded submenu-item text-gray-400 hover:text-gray-200 hover:bg-gray-700 transition-all text-sm">
                            <span>👥</span><span>Utilisateurs</span>
                        </a>
                        <a href="/app/habitago/properties" class="flex items-center space-x-3 px-4 py-2 rounded submenu-item text-gray-400 hover:text-gray-200 hover:bg-gray-700 transition-all text-sm">
                            <span>🏘️</span><span>Logements</span>
                        </a>
                        <a href="/app/habitago/contracts" class="flex items-center space-x-3 px-4 py-2 rounded submenu-item text-gray-400 hover:text-gray-200 hover:bg-gray-700 transition-all text-sm">
                            <span>📋</span><span>Contrats</span>
                        </a>
                        <!-- <a href="/app/habitago/payments" class="flex items-center space-x-3 px-4 py-2 rounded submenu-item text-gray-400 hover:text-gray-200 hover:bg-gray-700 transition-all text-sm">
                            <span>💰</span><span>Paiements</span>
                        </a> -->
                        <!-- <a href="/app/habitago/incidents" class="flex items-center space-x-3 px-4 py-2 rounded submenu-item text-gray-400 hover:text-gray-200 hover:bg-gray-700 transition-all text-sm">
                            <span>🔴</span><span>Incidents</span>
                        </a> -->
                        <!-- <a href="/app/habitago/intervenants" class="flex items-center space-x-3 px-4 py-2 rounded submenu-item text-gray-400 hover:text-gray-200 hover:bg-gray-700 transition-all text-sm">
                            <span>👨‍🔧</span><span>Intervenants</span>
                        </a> -->
                    </div>
                </div>

                <!-- 🌿 HabitaGreen (déroulant) -->
                <div class="space-y-1 mt-3">
                    <button id="habitagreen-toggle" class="w-full flex items-center justify-between px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 transition-all font-medium text-sm" data-toggle="habitagreen">
                        <div class="flex items-center space-x-3">
                            <span class="text-lg">🌿</span>
                            <span>HabitaGreen</span>
                        </div>
                        <svg id="habitagreen-icon" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                        </svg>
                    </button>
                    <div id="habitagreen-menu" class="space-y-1 hidden">
                        <a href="/app/habitagreen/dashboard" class="flex items-center space-x-3 px-4 py-2 rounded submenu-item text-gray-400 hover:text-gray-200 hover:bg-gray-700 transition-all text-sm">
                            <span>🌱</span><span>Dashboard Écologique</span>
                        </a>
                        <a href="/app/habitagreen/consumption" class="flex items-center space-x-3 px-4 py-2 rounded submenu-item text-gray-400 hover:text-gray-200 hover:bg-gray-700 transition-all text-sm">
                            <span>⚡</span><span>Consommations</span>
                        </a>

                        <a href="/app/habitagreen/challenges" class="flex items-center space-x-3 px-4 py-2 rounded submenu-item text-gray-400 hover:text-gray-200 hover:bg-gray-700 transition-all text-sm">
                            <span>🎯</span><span>Défis</span>
                        </a>
                        <a href="/app/habitagreen/scores" class="flex items-center space-x-3 px-4 py-2 rounded submenu-item text-gray-400 hover:text-gray-200 hover:bg-gray-700 transition-all text-sm">
                            <span>⭐</span><span>Scores</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Pied du sidebar -->
        <div class="p-4 border-t border-gray-600 space-y-2">
            <a href="/notifications" class="flex items-center space-x-3 px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition-all text-sm">
                <span class="text-lg">🔔</span>
                <span>Notifications</span>
            </a>
            <a href="/settings" class="flex items-center space-x-3 px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition-all text-sm">
                <span class="text-lg">⚙️</span>
                <span>Paramètres</span>
            </a>
            <button onclick="logout()" class="w-full flex items-center space-x-3 px-4 py-2 rounded-lg text-red-400 hover:bg-red-950 transition-all text-sm">
                <span class="text-lg">🚪</span>
                <span>Déconnexion</span>
            </button>
        </div>
    </aside>

    <!-- 📱 CONTENU PRINCIPAL (à remplir par chaque page) -->
    <main class="flex-1 flex flex-col overflow-auto" style="margin-left: 256px;">
        <!-- En-tête blanc -->
        <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">
                    <th:block layout:fragment="pageTitle">Dashboard</th:block>
                </h2>
                <nav class="flex items-center space-x-2 text-sm text-gray-600 mt-1">
                    <span class="text-green-admin font-medium">HabitAdmin</span>
                </nav>
            </div>
            <div class="flex items-center space-x-4">
                <button class="text-gray-600 hover:text-gray-900 text-lg">🔔</button>
                <div class="w-8 h-8 rounded-full bg-green-admin text-white flex items-center justify-center font-bold cursor-pointer">
                    A
                </div>
            </div>
        </header>

        <!-- Contenu scrollable -->
        <div class="flex-1 overflow-auto">
            <div class="max-w-7xl mx-auto p-8">
                <th:block layout:fragment="content">
                    <!-- Le contenu de chaque page va ici -->
                </th:block>
            </div>
        </div>
    </main>

    <!-- JavaScript pour les menus déroulants -->
    <script>
        const toggleButtons = document.querySelectorAll('[data-toggle]');

        toggleButtons.forEach(button => {
            button.addEventListener('click', function() {
                const toggleId = this.getAttribute('data-toggle');
                const menu = document.getElementById(toggleId + '-menu');
                const icon = document.getElementById(toggleId + '-icon');

                menu.classList.toggle('hidden');
                icon.style.transform = menu.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
            });
        });

        function logout() {
            if (confirm('Êtes-vous sûr de vouloir vous déconnecter ?')) {
                window.location.href = '/logout';
            }
        }
    </script>
</body>

</html>
