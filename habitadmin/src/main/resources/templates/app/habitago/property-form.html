<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app/app-layout}" lang="fr">

<head>
    <title th:text="${logement.id} ? 'Éditer un Logement' : 'Créer un Logement'">Formulaire Logement</title>
</head>

<body>
    <div layout:fragment="content" class="p-6">
        <!-- Titre -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800" th:text="${logement.id} ? 'Éditer un Logement' : 'Créer un Nouveau Logement'">
                Formulaire
            </h1>
            <p class="text-gray-600 mt-2">Remplissez les informations du logement</p>
        </div>

        <!-- Formulaire -->
        <div class="bg-white rounded-lg shadow p-8 max-w-2xl mx-auto">
            <form th:action="${logement.id} ? @{/app/habitago/properties/{id}(id=${logement.id})} : @{/app/habitago/properties}" 
                  th:method="${logement.id} ? 'post' : 'post'" 
                  class="space-y-6">

                <!-- Adresse -->
                <div>
                    <label for="adresse" class="block text-sm font-medium text-gray-700 mb-2">Adresse *</label>
                    <input type="text" 
                           id="adresse" 
                           name="adresse" 
                           th:value="${logement.adresse}" 
                           required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" 
                           placeholder="Ex: 123 Rue de la Paix">
                </div>

                <!-- Ville -->
                <div>
                    <label for="ville" class="block text-sm font-medium text-gray-700 mb-2">Ville *</label>
                    <input type="text" 
                           id="ville" 
                           name="ville" 
                           th:value="${logement.ville}" 
                           required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" 
                           placeholder="Ex: Paris">
                </div>

                <!-- Code Postal -->
                <div>
                    <label for="codePostal" class="block text-sm font-medium text-gray-700 mb-2">Code Postal *</label>
                    <input type="text" 
                           id="codePostal" 
                           name="codePostal" 
                           th:value="${logement.codePostal}" 
                           required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" 
                           placeholder="Ex: 75001"
                           pattern="[0-9]{5}">
                </div>

                <!-- Type de Logement -->
                <div>
                    <label for="typeLogement" class="block text-sm font-medium text-gray-700 mb-2">Type de Logement *</label>
                    <select id="typeLogement" 
                            name="typeLogement" 
                            required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
                        <option value="">-- Sélectionner un type --</option>
                        <option value="Studio" th:selected="${logement.typeLogement == 'Studio'}">Studio</option>
                        <option value="T2" th:selected="${logement.typeLogement == 'T2'}">T2</option>
                        <option value="T3" th:selected="${logement.typeLogement == 'T3'}">T3</option>
                        <option value="T4" th:selected="${logement.typeLogement == 'T4'}">T4</option>
                        <option value="T5" th:selected="${logement.typeLogement == 'T5'}">T5+</option>
                        <option value="Appartement" th:selected="${logement.typeLogement == 'Appartement'}">Appartement</option>
                        <option value="Maison" th:selected="${logement.typeLogement == 'Maison'}">Maison</option>
                    </select>
                </div>

                <!-- Boutons d'action -->
                <div class="flex gap-4 pt-6">
                    <button type="submit" 
                            class="flex-1 px-6 py-3 bg-green-500 text-white font-semibold rounded-lg hover:bg-green-600 transition-colors">
                        <span th:if="${logement.id}">💾 Mettre à jour</span>
                        <span th:if="!${logement.id}">✅ Créer</span>
                    </button>
                    <a href="/app/habitago/properties" 
                       class="flex-1 px-6 py-3 bg-gray-500 text-white font-semibold rounded-lg hover:bg-gray-600 transition-colors text-center">
                        ❌ Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
