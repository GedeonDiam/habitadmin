<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app/app-layout}" lang="fr">

<head>
    <title>Gestion des Logements</title>
</head>

<body>
    <div layout:fragment="content" class="p-6">
        <!-- Titre et bouton d'ajout -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Gestion des Logements</h1>
                <p class="text-gray-600 mt-2">Gérez tous vos logements</p>
            </div>
            <a href="/app/habitago/properties/new" class="px-6 py-3 bg-green-500 text-white font-semibold rounded-lg hover:bg-green-600 transition-all">
                ➕ Nouveau Logement
            </a>
        </div>

        <!-- Statistiques -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-6 rounded-lg shadow hover:shadow-lg transition-shadow">
                <h3 class="text-gray-6 font-semibold mb-2">Total</h3>
                <p class="text-3xl font-bold text-green-500" th:text="${logements.size()}">0</p>
                <p class="text-gray-500 text-sm mt-2">logements inscrits</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow hover:shadow-lg transition-shadow">
                <h3 class="text-gray-6 font-semibold mb-2">Appartements</h3>
                <p class="text-3xl font-bold text-blue-500" th:text="${#lists.size(#lists.stream(logements).filter(l -> l.typeLogement == 'Appartement').toList())}">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow hover:shadow-lg transition-shadow">
                <h3 class="text-gray-6 font-semibold mb-2">Maisons</h3>
                <p class="text-3xl font-bold text-purple-500" th:text="${#lists.size(#lists.stream(logements).filter(l -> l.typeLogement == 'Maison').toList())}">0</p>
            </div>
        </div>

        <!-- Tableau des logements -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full" th:if="${logements.size() > 0}">
                    <thead class="bg-gray-100 border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">ID</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">Adresse</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">Ville</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">Code Postal</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">Type</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">Date Création</th>
                            <th class="px-6 py-4 text-center text-sm font-semibold text-gray-700">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="logement : ${logements}" class="border-b border-gray-200 hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 text-sm text-gray-600" th:text="${logement.id}">-</td>
                            <td class="px-6 py-4 text-sm font-medium text-gray-800" th:text="${logement.adresse}">-</td>
                            <td class="px-6 py-4 text-sm text-gray-600" th:text="${logement.ville}">-</td>
                            <td class="px-6 py-4 text-sm text-gray-600" th:text="${logement.codePostal}">-</td>
                            <td class="px-6 py-4 text-sm">
                                <span th:if="${logement.typeLogement == 'Appartement'}" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-semibold">Appartement</span>
                                <span th:if="${logement.typeLogement == 'Maison'}" class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-semibold">Maison</span>
                                <span th:if="${logement.typeLogement == 'Studio'}" class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs font-semibold">Studio</span>
                                <span th:if="${logement.typeLogement == 'T2'}" class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-semibold">T2</span>
                                <span th:if="${logement.typeLogement == 'T3'}" class="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-xs font-semibold">T3</span>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-600" th:text="${#temporals.format(logement.dateCreation, 'dd/MM/yyyy HH:mm')}">-</td>
                            <td class="px-6 py-4 text-center">
                                <a th:href="@{/app/habitago/properties/{id}/edit(id=${logement.id})}" class="inline-block px-3 py-1 text-sm bg-blue-500 text-white rounded hover:bg-blue-600 transition-colors mr-2">
                                    ✏️ Éditer
                                </a>
                                <a th:href="@{/app/habitago/properties/{id}/delete(id=${logement.id})}" class="inline-block px-3 py-1 text-sm bg-red-500 text-white rounded hover:bg-red-600 transition-colors" onclick="return confirm('Êtes-vous sûr?');">
                                    🗑️ Supprimer
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <!-- Message quand aucun logement -->
                <div th:if="${logements.isEmpty()}" class="p-8 text-center">
                    <p class="text-gray-500 text-lg">Aucun logement enregistré</p>
                    <a href="/app/habitago/properties/new" class="mt-4 inline-block px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">
                        Créer un logement
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
